name: Build and publish

on:
  push:
    branches: [main, claude/solisia-landing-setup-sztnel]
  workflow_dispatch:

# Only needs to push the built site to the gh-pages branch. Deliberately does
# not use the github-pages environment or deploy-pages action: GitHub serves
# gh-pages via the ordinary "Deploy from a branch" Pages source.
permissions:
  contents: write

# One concurrency group per branch: a push to main and a push to the dev
# branch publish to different targets (root vs. /preview/) and must not
# cancel each other, but repeated pushes to the *same* branch should queue.
concurrency:
  group: gh-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # main -> production, served at the solisia.net domain root (see
      # public/CNAME). anything else -> preview, served at /preview/ under
      # that same domain so it never touches the production build. Vite's
      # `base` has to match at build time so the built asset URLs resolve
      # under the right subpath.
      - name: Determine publish target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "subdir=" >> "$GITHUB_OUTPUT"
            echo "label=production" >> "$GITHUB_OUTPUT"
          else
            echo "base=/preview/" >> "$GITHUB_OUTPUT"
            echo "subdir=preview" >> "$GITHUB_OUTPUT"
            echo "label=preview" >> "$GITHUB_OUTPUT"
          fi

      # Formspree endpoint for the contact form (src/lib/submitContact.js).
      # Not a secret — it ends up embedded in the public JS bundle either
      # way, same as it would in any client-side form integration — so it's
      # set directly here rather than routed through repo secrets/vars.
      - name: Build
        env:
          VITE_CONTACT_ENDPOINT: https://formspree.io/f/xzebglqy
        run: npx vite build --base="${{ steps.target.outputs.base }}"

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBDIR: ${{ steps.target.outputs.subdir }}
          LABEL: ${{ steps.target.outputs.label }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Check out the existing gh-pages branch so publishing one target
          # (root or /preview/) never deletes the other. Falls back to an
          # empty branch on the very first run.
          rm -rf /tmp/gh-pages
          if git clone --branch gh-pages --single-branch --depth 1 "$REMOTE" /tmp/gh-pages 2>/dev/null; then
            :
          else
            mkdir -p /tmp/gh-pages
            git -C /tmp/gh-pages init -q -b gh-pages
          fi

          if [ -n "$SUBDIR" ]; then
            TARGET="/tmp/gh-pages/$SUBDIR"
            rm -rf "$TARGET"
          else
            TARGET="/tmp/gh-pages"
            # Publishing to root: clear everything except the preview subtree.
            find "$TARGET" -mindepth 1 -maxdepth 1 ! -name "$SUBDIR" ! -name preview ! -name .git -exec rm -rf {} +
          fi
          mkdir -p "$TARGET"
          cp -r dist/. "$TARGET/"

          cd /tmp/gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish for $LABEL."
          else
            git commit -q -m "Publish $LABEL: ${GITHUB_SHA::7}"
            git push "$REMOTE" gh-pages
          fi
