name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, publish Pages, and mint the OIDC token
# that deploy-pages uses to prove the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages is enabled in repo Settings (Source: GitHub Actions). Note that
      # configure-pages' enablement:true option cannot do this for us — the
      # workflow GITHUB_TOKEN lacks the admin scope the create-site API needs.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # No build step — the repository root is the site. The action
      # excludes .git and .github from the uploaded artifact.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
