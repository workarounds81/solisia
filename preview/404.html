<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Solisia</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400&family=Newsreader:opsz,wght@6..72,300&display=swap"
      rel="stylesheet"
    />
    <!-- Self-contained on purpose: Pages serves this for a missing URL at any
         depth, so no relative asset path is reliable here. Keep the values in
         sync with src/index.css. -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-content: center;
        gap: 1rem; padding: 1.5rem; text-align: center;
        font-family: 'Instrument Sans', system-ui, sans-serif; line-height: 1.6;
        color: #070c0f; background: #f2f4ef;
      }
      h1 { margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 300; font-size: 2.5rem; line-height: 1.1; }
      p { margin: 0; color: rgba(7, 12, 15, 0.6); }
      a { color: #070c0f; }
      a:hover { color: #e6ad3d; }
    </style>
  </head>
  <body>
    <h1>Page not found</h1>
    <p>That page doesn&rsquo;t exist, or it has moved.</p>
    <p><a href="/">Back to home</a></p>
  </body>
</html>
