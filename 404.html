<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Solisia</title>

    <!--
      Deliberately self-contained. GitHub Pages serves this file for a missing
      URL at any depth, so relative asset paths would resolve differently
      depending on the URL that failed. Inlining the few styles it needs keeps
      it correct everywhere. Keep these values in sync with tokens.css.
    -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
        line-height: 1.6;
        color: #1a1a18;
        background-color: #ffffff;
      }

      h1 {
        margin: 0;
        font-size: 2.281rem;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #5c5c56;
      }

      .button {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background-color: #2f6f62;
        color: #ffffff;
        font-weight: 500;
        text-decoration: none;
      }

      .button:hover {
        background-color: #23554b;
      }
    </style>
  </head>
  <body>
    <h1>Page not found</h1>
    <p>That page doesn&rsquo;t exist, or it has moved.</p>
    <!-- Project site lives under /solisia/. Change to "/" if a custom apex domain is added. -->
    <p><a class="button" href="/solisia/">Back to home</a></p>
  </body>
</html>
